name: Release Windows app

on:
  push:
    tags:
      - 'v1.2.*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Verify tag and package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
          [[ "${package_version}" =~ ^1\.2\.[0-9]+$ ]]
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:supabase
      - run: npm run security:scan
      - run: npm run build

  publish-windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Require trusted Windows signing
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'Production publishing requires trusted Windows code-signing secrets.'
          }
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run publish:win
      - run: npm run verify:release
      - uses: actions/upload-artifact@v6
        with:
          name: Lyor-Setup-V1.2-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            release/Lyor-Setup-*.exe
            release/Lyor-Setup-*.exe.blockmap
            release/latest.yml
            release/artifact-sha256.json
