name: Release Windows app

on:
  push:
    tags:
      - 'v1.2.*'
  workflow_dispatch:
    inputs:
      unsigned_test_release:
        description: 'Publish an explicitly unsigned public test release'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Verify tag and package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          [[ "${package_version}" =~ ^1\.2\.[0-9]+$ ]]
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            test "v${package_version}" = "${GITHUB_REF_NAME}"
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:supabase
      - run: npm run security:scan
      - run: npm run build

  publish-windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Require trusted Windows signing
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.unsigned_test_release != true }}
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'Production publishing requires trusted Windows code-signing secrets.'
          }
      - name: Prepare production runtime configuration
        env:
          LYOR_SUPABASE_URL: ${{ secrets.LYOR_SUPABASE_URL }}
          LYOR_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LYOR_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run prepare:production-runtime
      - name: Create unsigned test release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.unsigned_test_release == true }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          git fetch --tags --force
          $existing = git rev-list -n 1 $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -ne $env:GITHUB_SHA) {
              throw "$tag already points to a different commit. Bump package.json before publishing."
            }
          } else {
            git tag $tag $env:GITHUB_SHA
            git push origin $tag
          }
      - name: Ensure GitHub Release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          try {
            Invoke-RestMethod -Uri $releaseUri -Headers $headers | Out-Null
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
            $isUnsigned = $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and '${{ inputs.unsigned_test_release }}' -eq 'true'
            $title = if ($isUnsigned) { "Lyor $tag - Unsigned Test" } else { "Lyor $tag" }
            $notes = if ($isUnsigned) {
              'Unsigned public test build. Windows may show Unknown publisher or SmartScreen warnings.'
            } else {
              "Lyor $tag"
            }
            $body = @{
              tag_name = $tag
              target_commitish = $env:GITHUB_SHA
              name = $title
              body = $notes
              draft = $false
              prerelease = $false
            } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers $headers -Body $body -ContentType 'application/json' | Out-Null
          }
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          LYOR_ALLOW_UNSIGNED_TEST_RELEASE: ${{ inputs.unsigned_test_release || 'false' }}
        run: npm run publish:win
      - name: Verify trusted Authenticode signatures
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.unsigned_test_release != true }}
        shell: pwsh
        run: |
          $targets = @(
            'release/win-unpacked/Lyor.exe',
            "release/Lyor-Setup-$((Get-Content package.json | ConvertFrom-Json).version)-x64.exe"
          )
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode verification failed for $target: $($signature.Status)"
            }
          }
      - name: Verify production release artifacts
        run: npm run verify:release
      - uses: actions/upload-artifact@v6
        with:
          name: Lyor-Setup-V1.2-${{ github.run_id }}
          if-no-files-found: error
          path: |
            release/Lyor-Setup-*.exe
            release/Lyor-Setup-*.exe.blockmap
            release/latest.yml
            release/artifact-sha256.json
